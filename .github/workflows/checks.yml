name: Platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos-checks:
    name: macOS Swift checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Run package checks
        run: swift run WiFiMonitorChecks

  windows-core-tests:
    name: Windows core tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run core unit tests
        run: dotnet test .\Windows\tests\NetworkMonitor.Core.Tests\NetworkMonitor.Core.Tests.csproj --configuration Release
